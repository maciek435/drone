<!DOCTYPE html>
<html>
<head>
    <title>Drone HUD</title>
    <script src="{{ url_for('static', filename='chart.js') }}"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .video-background {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; z-index: 1;
        }

        /* Przycisk telemetrii — prawy górny róg */
        #menuBtn {
            position: absolute; top: 20px; right: 20px;
            padding: 10px 20px; z-index: 10;
            background: rgba(0, 255, 0, 0.2); color: #0f0;
            border: 1px solid #0f0; cursor: pointer;
            text-transform: uppercase; font-weight: bold;
        }

        /* Overlay z wykresami */
        #telemetryOverlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 5;
        }

        .charts-container {
            display: flex; gap: 15px; padding: 20px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #0f0; border-radius: 10px;
            flex-wrap: wrap; justify-content: center;
        }

        canvas { width: 320px !important; height: 180px !important; }

        .status-bar {
            margin-top: 15px; color: #fff; font-size: 14px;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }

        /* Pasek statusu — zawsze widoczny na dole, nawet bez overlay */
        #infoBar {
            position: absolute; bottom: 20px; left: 20px;
            z-index: 10; color: #fff; font-size: 13px;
            background: rgba(0, 0, 0, 0.55); padding: 6px 14px;
            border-radius: 4px; border: 1px solid #333;
        }

        /* Kolor kropki statusu detekcji */
        .dot-ok  { color: #0f0; }
        .dot-lost { color: #f44; }
    </style>
</head>
<body>

    <img src="{{ url_for('video_feed') }}" class="video-background">

    <button id="menuBtn" onclick="toggleTelemetry()">Telemetry [T]</button>

    <!-- Pasek zawsze widoczny — ERR_X, ERR_Y, BATT, status detekcji -->
    <div id="infoBar">
        <span id="detDot" class="dot-lost">●</span>
        ERR_X: <span id="infoX" style="color:#ff00ff">0</span> px |
        ERR_Y: <span id="infoY" style="color:#00ffff">0</span> px |
        BATT: <span id="infoBatt" style="color:#0f0">--</span> |
        FOLLOW: <span id="infoFollow" style="color:#ff0">OFF</span>
    </div>

    <!-- Overlay z wykresami -->
    <div id="telemetryOverlay">
        <h2 style="color:#0f0; text-shadow: 0 0 10px #0f0;">TELEMETRY</h2>
        <div class="charts-container">
            <div><canvas id="chartX"></canvas></div>
            <div><canvas id="chartY"></canvas></div>
        </div>
        <div class="status-bar">
            ERR_X: <span id="valX" style="color:#ff00ff">0</span> px |
            ERR_Y: <span id="valY" style="color:#00ffff">0</span> px |
            BATT: <span id="valBatt" style="color:#0f0">--</span>
        </div>
    </div>

    <script>
        let showTelemetry = false;

        function toggleTelemetry() {
            showTelemetry = !showTelemetry;
            const overlay = document.getElementById('telemetryOverlay');
            overlay.style.display = showTelemetry ? 'flex' : 'none';
            document.getElementById('menuBtn').innerText =
                showTelemetry ? 'Close [T]' : 'Telemetry [T]';
        }

        window.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 't') toggleTelemetry();
        });

        // Konfiguracja wykresów — identyczna jak w Tello
        const makeConfig = (label, color) => ({
            type: 'line',
            data: {
                labels: Array(60).fill(''),
                datasets: [{
                    label: label,
                    data: Array(60).fill(0),
                    borderColor: color,
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                animation: false,
                responsive: false,
                scales: {
                    y: {
                        min: -160, max: 160,
                        grid: { color: '#222' },
                        ticks: { color: '#888' }
                    },
                    x: { display: false }
                },
                plugins: {
                    legend: {
                        labels: { color: '#fff', font: { family: 'Courier New' } }
                    }
                }
            }
        });

        const chartX = new Chart(
            document.getElementById('chartX'),
            makeConfig('Error X (lewo/prawo)', '#ff00ff')
        );
        const chartY = new Chart(
            document.getElementById('chartY'),
            makeConfig('Error Y (góra/dół)', '#00ffff')
        );

        // Polling telemetrii co 100ms — identycznie jak w Tello
        setInterval(() => {
            fetch('/telemetry')
                .then(r => r.json())
                .then(data => {
                    const detected = data.detected;

                    // Pasek zawsze widoczny
                    document.getElementById('infoX').innerText    = data.err_x;
                    document.getElementById('infoY').innerText    = data.err_y;
                    document.getElementById('infoBatt').innerText = data.batt;

                    // Kropka statusu detekcji
                    const dot = document.getElementById('detDot');
                    dot.className = detected ? 'dot-ok' : 'dot-lost';
                    
                    const followEl = document.getElementById('infoFollow');
                    if (data.follow) {
                        followEl.innerText = 'ON';
                        followEl.style.color = '#0f0';
                    } else {
                        followEl.innerText = 'OFF';
                        followEl.style.color = '#f44';
                    }

                    // Wykresy i overlay — tylko gdy otwarte
                    if (showTelemetry) {
                        chartX.data.datasets[0].data.push(data.err_x);
                        chartX.data.datasets[0].data.shift();
                        chartY.data.datasets[0].data.push(data.err_y);
                        chartY.data.datasets[0].data.shift();
                        chartX.update();
                        chartY.update();

                        document.getElementById('valX').innerText    = data.err_x;
                        document.getElementById('valY').innerText    = data.err_y;
                        document.getElementById('valBatt').innerText = data.batt;
                    }
                });
        }, 100);
    </script>
</body>
</html>
